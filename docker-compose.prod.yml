# docker-compose.prod.yml
# 운영 배포 구성 (VM 1대)
#
#   docker compose -f docker-compose.prod.yml --env-file env/.env.prod up -d --build
#   (env 파일 위치를 바꾸려면 PROD_ENV_FILE=경로 와 --env-file 경로를 함께 지정)
#
# - 외부에는 Caddy(80/443)만 열고, Django·AI 서버·DB·Redis는 내부망에서만 통신합니다.
# - 소스는 이미지에 담기므로 코드를 바꾸면 --build로 다시 빌드합니다.
# - 환경 변수 예시는 deploy/env.prod.example을 참고하세요.

name: mai-prod

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-maple_chatbot_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    env_file:
      - ${PROD_ENV_FILE:-env/.env.prod}
    environment:
      - DATABASE_HOST=db
      - DB_CONNECTION=
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # 임베딩 모델(1GB 이상)을 컨테이너를 다시 만들어도 다시 받지 않도록 보관합니다.
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    env_file:
      - ${PROD_ENV_FILE:-env/.env.prod}
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVER_URL=http://fastapi:8001
    command: >
      sh -c "python manage.py migrate --noinput &&
      exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --workers $${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/core/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  hf_cache:
  caddy_data:
  caddy_config:
