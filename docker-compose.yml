services:
  db:
    image: ankane/pgvector:latest
    container_name: mai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "ccg2558!@#"
      POSTGRES_DB: maple_chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis/redis-stack-server:latest
    container_name: mai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always


  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: mai_django
    ports:
      - "8000:8000"
    env_file:
      - env/.env.local
    environment:
      - DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVER_URL=http://fastapi:8001
    volumes:
      - .:/app
      - /app/.venv  # 로컬 가상환경(.venv)이 컨테이너 내부를 덮어쓰지 않도록 익명 볼륨 처리
    command: >
      sh -c "until python -c \"import socket; socket.create_connection(('db', 5432), timeout=1)\" 2>/dev/null; do
      echo 'Waiting for database connection on db:5432...';
      sleep 1;
      done && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis
    restart: always

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: mai_fastapi
    ports:
      - "8001:8001"
    env_file:
      - env/.env.local
    environment:
      - DB_CONNECTION=postgresql+psycopg://postgres:ccg2558%21%40%23@db:5432/maple_chatbot_db
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PATH=/app/fine_tuned_model/merged_qwen
    volumes:
      - .:/app
      - /app/.venv  
    command: >
      sh -c "until python -c \"import socket; socket.create_connection(('db', 5432), timeout=1)\" 2>/dev/null; do
      echo 'Waiting for database connection on db:5432...';
      sleep 1;
      done && python -m ai_server.main"
    depends_on:
      - db
      - redis
    restart: always

volumes:
  pgdata:
  redis_data:
